name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Publish the crates to crates.io, in dependency order. Skipped with
  # --no-verify: ci.yml is the build gate, and verifying here would rebuild the
  # whole C stack three times. The vendored C sources ship inside the -sys
  # package (2.2 MiB), so it builds on a consumer's machine without submodules.
  crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p restorekit-sys --no-verify
          cargo publish -p restorekit-dongle-proto --no-verify
          cargo publish -p restorekit --no-verify
          cargo publish -p restorekit-cli --no-verify

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config cmake autoconf-archive \
            libusb-1.0-0-dev libssl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config cmake autoconf-archive

      # No cache: this workflow only runs on tag refs, which can restore
      # caches from main only — and those are keyed for ci's debug builds, so
      # a release build here never hits.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build (self-contained static binary)
        run: cargo build --release --locked -p restorekit-cli

      - name: Stage artifact
        run: |
          mkdir -p "artifacts/restorekit_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp target/release/restorekit \
            "artifacts/restorekit_${{ matrix.goos }}_${{ matrix.goarch }}/restorekit"

      - uses: actions/upload-artifact@v4
        with:
          name: restorekit_${{ matrix.goos }}_${{ matrix.goarch }}
          path: artifacts/restorekit_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  # Windows builds with the GNU toolchain inside MSYS2 (the autotools C stack
  # can't target MSVC). Uploads the same artifact shape as the `build` matrix so
  # the `release` job's GoReleaser step packages it alongside the others.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Skip the full `pacman -Syuu` — it can leave a package half-upgraded
          # when Windows won't let pacman replace an in-use binary. See the
          # matching note in release-app.yml: that split MSYS2's perl and broke
          # the vendored-OpenSSL build. This job got lucky on v0.5.9, but it
          # runs the same toolchain, so pin it the same way.
          update: false
          install: >-
            base-devel
            git
            make
            autoconf
            automake
            libtool
            autoconf-archive
            gettext-devel
            pkgconf
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-nasm

      # GNU host toolchain: build scripts link with ld, not MSVC's link.exe
      # (which MSYS2's coreutils `link` would shadow in the MINGW64 shell).
      # No cache: tag refs never hit (see the build job above).
      - name: Install Rust toolchain (windows-gnu)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build (self-contained static binary)
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --locked -p restorekit-cli --target x86_64-pc-windows-gnu

      - name: Stage artifact
        shell: msys2 {0}
        run: |
          mkdir -p "artifacts/restorekit_windows_amd64"
          cp target/x86_64-pc-windows-gnu/release/restorekit.exe \
            "artifacts/restorekit_windows_amd64/restorekit.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: restorekit_windows_amd64
          path: artifacts/restorekit_windows_amd64
          if-no-files-found: error

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: restorekit_*
          merge-multiple: false

      - name: Mark binaries executable
        run: chmod +x artifacts/*/restorekit artifacts/*/restorekit.exe

      # Shipped in the archives and installed by the Homebrew cask.
      - name: Generate shell completions
        run: |
          mkdir -p completions
          for shell in bash zsh fish; do
            ./artifacts/restorekit_linux_amd64/restorekit completions "$shell" \
              > "completions/restorekit.$shell"
          done

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One token for both the Homebrew tap and the Scoop bucket.
          TAP_GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

  # Pack the CLI binary into a snap and publish it to the Snap Store as
  # `restorekit-cli` (the plain `restorekit` name is the desktop app, published
  # from release-app.yml). GoReleaser can't do this: the binary links libusb
  # dynamically, core24 doesn't ship libusb-1.0.so.0, and its `snapcrafts`
  # block has no `stage-packages` escape hatch.
  #
  # One runner per arch — destructive mode builds on the host directly, so
  # stage-packages can only pull the host's debs, and ubuntu-24.04 matches the
  # snap's core24 base. Pack runs under sudo (snapcraft shells out to `snap`,
  # which snapd only allows as root) and swallows snap's stderr, so dump its
  # log on failure to see the real error.
  snap:
    # After `release`, not just `build`, so a failed GitHub release can't leave
    # a published snap behind (the ordering GoReleaser gave us before).
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
          - os: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: restorekit_linux_${{ matrix.goarch }}
          path: snapbuild/bin

      - name: Build & publish the snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sudo snap install snapcraft --classic
          # The executable bit doesn't survive the artifact round-trip.
          chmod +x snapbuild/bin/restorekit
          sed "s/VERSION_PLACEHOLDER/${version}/" crates/restorekit-cli/snap/snapcraft.yaml \
            > snapbuild/snapcraft.yaml
          cd snapbuild
          sudo snapcraft pack --destructive-mode || {
            sudo cat /root/.local/state/snapcraft/log/*.log
            exit 1
          }
          snapcraft upload --release=stable \
            "restorekit-cli_${version}_${{ matrix.goarch }}.snap"
