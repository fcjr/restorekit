version: 2

project_name: restorekit

# Binaries are built natively per-platform in CI (the self-contained static C
# stack can't be zig cross-compiled) and downloaded into ./artifacts before
# goreleaser runs. Here we only assemble/package them. The `prebuilt` builder
# is GoReleaser Pro-only, so the OSS build stage is shimmed: gobinary points
# at a script that copies artifacts/restorekit_<os>_<arch>/restorekit instead
# of compiling.
builds:
  - id: restorekit
    binary: restorekit
    tool: ./scripts/goreleaser-prebuilt.sh
    no_main_check: true
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # Only amd64 is built for Windows (see build-windows in release.yml).
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: restorekit
    ids: [restorekit]
    formats: [tar.gz]
    # Windows users expect a .zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      # Generated by release.yml from the built binary before goreleaser runs.
      - completions/*
      # Linux USB permissions. The cask's postflight installs this into
      # /etc/udev/rules.d; tarball users copy it themselves (see README).
      - udev/51-restorekit.rules

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  # The CLI ships as `restorekit-cli`; the plain `restorekit` cask token is
  # reserved for the desktop app. The installed binary is still `restorekit`.
  - name: restorekit-cli
    binaries: [restorekit]
    repository:
      owner: fcjr
      name: homebrew-fcjr
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/fcjr/restorekit"
    description: "DFU-restore Apple Silicon Macs from the command line"
    # Shipped pre-generated in the archive (see archives.files above).
    completions:
      bash: completions/restorekit.bash
      zsh: completions/restorekit.zsh
      fish: completions/restorekit.fish
    # macOS: unsigned binary, so strip the quarantine bit or Gatekeeper blocks it.
    # Linux: install the udev rule, otherwise every USB operation fails with
    # "permission denied (errno 13)" unless the whole CLI is run as root.
    # Homebrew can't write to /etc on its own, so this asks for sudo; declining
    # (or a non-interactive install) just leaves the rule out, hence
    # must_succeed: false and the caveat below.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/restorekit"]
          elsif OS.linux?
            src = "#{staged_path}/udev/51-restorekit.rules"
            dst = "/etc/udev/rules.d/51-restorekit.rules"
            # Skip the sudo prompt when the rule is already current (upgrades).
            if File.exist?(src) && !(File.exist?(dst) && File.read(dst) == File.read(src))
              ohai "Installing #{dst} so restorekit can reach USB devices without sudo"
              result = begin
                system_command "/bin/sh",
                               args: ["-c", "install -m 0644 '#{src}' '#{dst}' && " \
                                            "udevadm control --reload-rules && udevadm trigger"],
                               sudo: true,
                               must_succeed: false
              rescue StandardError => e
                opoo "sudo failed: #{e.message}"
                nil
              end
              if result&.success?
                ohai "Replug the device for the new permissions to take effect"
              else
                opoo "#{dst} was not installed; restorekit needs sudo until it is (see caveats)"
              end
            end
          end
    # Left in place by a plain uninstall (an upgrade would just reinstall it);
    # `brew uninstall --zap` takes it out.
    zap:
      delete:
        - /etc/udev/rules.d/51-restorekit.rules
    caveats: |
      restorekit triggers DFU mode only from an Apple Silicon Mac host, and
      needs root for that step (sudo restorekit dfu). Restores run on macOS
      and Linux.

      On Linux this cask installs /etc/udev/rules.d/51-restorekit.rules (asking
      for sudo) so USB access works without root; replug the device afterwards.
      If you skipped that prompt, run `brew reinstall restorekit-cli`, or copy
      udev/51-restorekit.rules out of the Caskroom yourself and run
      `sudo udevadm control --reload-rules && sudo udevadm trigger`.

# No `snapcrafts:` block — the snap is packed by hand from
# crates/restorekit-cli/snap/snapcraft.yaml in release.yml. The binary links
# libusb dynamically and core24 doesn't ship it, so the snap needs
# `stage-packages`, which GoReleaser's snapcrafts block can't express.

scoops:
  # Same naming rationale as the cask: the plain `restorekit` name is reserved
  # for the desktop app. The installed binary is still `restorekit`.
  - name: restorekit-cli
    repository:
      owner: fcjr
      name: scoop-fcjr
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/fcjr/restorekit"
    description: "DFU-restore Apple Silicon Macs from the command line"
    license: Apache-2.0

release:
  github:
    owner: fcjr
    name: restorekit
